name: dystopia
description: "DYSTOPIA - A modern, premium music player for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.4

  # Audio
  just_audio: ^0.9.46
  audio_service: ^0.18.17

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Storage & Files
  path_provider: ^2.1.5
  path: ^1.9.1

  # Permissions
  permission_handler: ^11.4.0

  # Images
  cached_network_image: ^3.4.1

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Notifications
  flutter_local_notifications: ^19.0.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  equatable: ^2.0.7
  rxdart: ^0.28.0
  device_info_plus: ^12.4.0
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
